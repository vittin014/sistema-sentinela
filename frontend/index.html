<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Pro - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="container login-box">
  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário ou Matrícula">
  <input id="senha" type="password" placeholder="Senha de Acesso">
  <button onclick="login()">Entrar no Sistema</button>
  <div class="form-footer">Painel de Acesso Restrito a Colaboradores</div>
</div>

<script>
function login() {
  fetch("http://localhost:10000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  })
  .catch(err => alert("Erro ao tentar fazer login. Certifique-se de que o node backend/server.js está rodando."));
}
</script>
</body>
</html>
